# Draft recipe for the fdroiddata merge request (goes in its metadata/
# folder). Store texts come from fastlane/ in this repo.
Categories:
  - Time
License: GPL-3.0-or-later
AuthorName: Koc13
SourceCode: https://github.com/Koc13/TimeManager
IssueTracker: https://github.com/Koc13/TimeManager/issues
Changelog: https://github.com/Koc13/TimeManager/blob/HEAD/CHANGELOG.md

AutoName: Time Manager

RepoType: git
Repo: https://github.com/Koc13/TimeManager.git

Builds:
  - versionName: 0.1.0
    versionCode: 1
    commit: v0.1.0
    output: build/app/outputs/flutter-apk/app-release.apk
    srclibs:
      - flutter@3.47.0
    prebuild:
      - export PUB_CACHE=$(pwd)/.pub-cache
      - $$flutter$$/bin/flutter config --no-analytics
      - $$flutter$$/bin/flutter pub get
    scandelete:
      - .pub-cache
    build:
      - export PUB_CACHE=$(pwd)/.pub-cache
      - $$flutter$$/bin/flutter build apk --release

AutoUpdateMode: Version
UpdateCheckMode: Tags
UpdateCheckData: pubspec.yaml|version:\s.+\+(\d+)|.|version:\s(.+)\+
CurrentVersion: 0.1.0
CurrentVersionCode: 1
