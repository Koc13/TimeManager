  <rect x="14" y="14" width="80" height="80" rx="18" fill="#161826"/>
  <circle cx="54" cy="54" r="24" fill="none" stroke="#2B2741" stroke-width="5"/>
  <path d="M54,30 A24,24 0 1,1 30,54" fill="none" stroke="#796CBF" stroke-width="5" stroke-linecap="round"/>
  <path d="M44,54.5 L51,61.5 L64.5,47" fill="none" stroke="#D2CEFD" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
